# Fork / 内测用：只打 Windows 安装包，上传为 Artifact，并挂到同名 tag 的 Release。
# 不走正式发版门禁（不要求去掉 -dev、不签 releases.json）。
# 触发：手动 workflow_dispatch，或推送 build-windows* 标签。
name: windows-installer

on:
  workflow_dispatch:
  push:
    tags: ['build-windows*']

env:
  CARGO_TERM_COLOR: always
  QINGJIAN_UIACCESS: '0'
  PYTHON: python
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch product data
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qingjian-windows-installer
          path: target/installer/*.exe
          if-no-files-found: error

      - name: Publish release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = Get-Item target\installer\*.exe | Select-Object -First 1
          if (-not $exe) { throw '没找到安装包' }
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag $exe.FullName `
            --title "青简 Windows 安装包 ($tag)" `
            --notes "内测包：含数字密码框倒序修复。无代码签名，SmartScreen 可点「更多信息 → 仍要运行」。候选窗在任务栏搜索等系统界面可能被遮挡（QINGJIAN_UIACCESS=0）。" `
            --latest=false
